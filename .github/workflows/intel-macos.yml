name: Intel Mac AU shell build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel-macos:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x86_64 build (Monterey deployment target)
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build core, tests, and AU plugin
        run: cmake --build build --parallel 2

      - name: Run scaffold tests
        run: ctest --test-dir build --output-on-failure

      - name: Package AU component with its .component bundle folder
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/MorpheusLab_artefacts/Release/AU/Morpheus Lab.component" \
            "Morpheus-Lab-AU-Intel.zip"

      - name: Upload installable AU package
        uses: actions/upload-artifact@v4
        with:
          name: Morpheus-Lab-AU-Intel
          path: Morpheus-Lab-AU-Intel.zip
          if-no-files-found: error
